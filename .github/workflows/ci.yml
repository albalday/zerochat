name: Validate

on:
  pull_request:
    branches: [dev, master]
    paths-ignore:
      - 'help/**'
      - 'docs/**'
      - '.zerochat/**'
      - '*.md'
  push:
    branches: [dev, master]
    paths-ignore:
      - 'help/**'
      - 'docs/**'
      - '.zerochat/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Node 22 (la última 22.x) cumple el mínimo del runner, 22.13 (NODE_MINIMUM_VERSION en py/run_mode/state.py).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:infrastructure
      - run: npm run test:architecture
      - run: npm run test:integration
      - name: Verify PyPI packaging
        if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
        run: |
          python -m pip install --upgrade build twine
          rm -rf dist build
          python -m build
          python -m twine check dist/*
          python tests/packaging_smoke_test.py dist

  # Rutas propias de Windows y macOS (LogonUserW, Job Object, permisos de los datos) en las pruebas Python.
  platforms:
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/infrastructure/py -t tests/infrastructure/py

  browser:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-runner.mjs --level=browser --concurrency=2 --retry
