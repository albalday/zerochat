[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerochat"
version = "7.8.0"
description = "Private local web client for AI models, tools and MCP services"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alberto Alday" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://albalday.github.io/zerochat/"
Repository = "https://github.com/albalday/zerochat"
Issues = "https://github.com/albalday/zerochat/issues"

[project.scripts]
zerochat = "zerochat:main"

[tool.setuptools]
py-modules = ["zerochat"]
